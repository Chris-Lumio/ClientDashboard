<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lumio Operations — Secure Login</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛡️</text></svg>">
  <style>
    :root {
      --bg: #090d16;
      --card-bg: rgba(17, 24, 39, 0.85);
      --card-border: #1f293d;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --text-dim: #6b7280;
      --lumio-blue: #293896;
      --lumio-cyan: #20C4F4;
      --lumio-purple: #7351A1;
      --accent: #20C4F4;
      --accent-hover: #1bb0dc;
      --accent-glow: rgba(32, 196, 244, 0.3);
      --danger: #ef4444;
      --danger-bg: rgba(239, 68, 68, 0.12);
      --danger-border: rgba(239, 68, 68, 0.35);
      --success: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      background-image: 
        radial-gradient(at 10% 20%, rgba(41, 56, 150, 0.35) 0px, transparent 50%),
        radial-gradient(at 90% 80%, rgba(115, 81, 161, 0.28) 0px, transparent 50%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-container {
      width: 100%;
      max-width: 420px;
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 36px 32px;
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.6), 0 0 25px rgba(41, 56, 150, 0.25);
      display: flex;
      flex-direction: column;
      gap: 24px;
      animation: fadeIn 0.4s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .brand-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 12px;
    }

    .brand-icon {
      width: 56px;
      height: 56px;
      background: linear-gradient(135deg, #293896, #7351A1);
      border: 1px solid rgba(32, 196, 244, 0.35);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      box-shadow: 0 0 25px var(--accent-glow);
    }

    .brand-title h1 {
      font-size: 1.45rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .brand-title p {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .security-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(41, 56, 150, 0.25);
      border: 1px solid rgba(32, 196, 244, 0.35);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.72rem;
      color: #20C4F4;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .alert {
      background: var(--danger-bg);
      border: 1px solid var(--danger-border);
      color: #fca5a5;
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 0.84rem;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .alert-icon {
      font-size: 1.1rem;
      flex-shrink: 0;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .form-group label {
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-muted);
      letter-spacing: 0.02em;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon {
      position: absolute;
      left: 14px;
      color: var(--text-dim);
      font-size: 15px;
      pointer-events: none;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 12px 14px 12px 42px;
      color: var(--text-main);
      font-size: 0.92rem;
      outline: none;
      transition: all 0.2s ease;
    }

    input[type="text"]:focus,
    input[type="password"]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(32, 196, 244, 0.25);
    }

    .toggle-pwd {
      position: absolute;
      right: 12px;
      background: none;
      border: none;
      color: var(--text-dim);
      cursor: pointer;
      font-size: 14px;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .toggle-pwd:hover {
      color: var(--text-main);
    }

    .form-extra {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.82rem;
      color: var(--text-muted);
    }

    .remember-label {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      user-select: none;
    }

    .remember-label input[type="checkbox"] {
      accent-color: var(--accent);
      width: 16px;
      height: 16px;
      cursor: pointer;
    }

    .btn-submit {
      background: linear-gradient(135deg, #293896, #7351A1);
      border: 1px solid rgba(32, 196, 244, 0.35);
      border-radius: 10px;
      color: #fff;
      font-weight: 600;
      font-size: 0.95rem;
      padding: 13px 20px;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 15px rgba(41, 56, 150, 0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 6px;
    }

    .btn-submit:hover {
      background: linear-gradient(135deg, #7351A1, #20C4F4);
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(32, 196, 244, 0.35);
      color: #fff;
    }

    .btn-submit:active {
      transform: translateY(0);
    }

    .footer-note {
      text-align: center;
      font-size: 0.74rem;
      color: var(--text-dim);
      line-height: 1.5;
    }

    .host-pill {
      font-family: monospace;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="brand-header">
      <div class="brand-icon">🛡️</div>
      <div class="brand-title">
        <h1>Lumio Fleet Operations</h1>
        <p>Telemetry & Monitoring Infrastructure</p>
      </div>
      <div class="security-badge">
        <span>🔒 Access Control Active</span>
      </div>
    </div>

    <!-- Error Banner (Server Replaced) -->
    <!-- ERROR_BANNER_PLACEHOLDER -->

    <form method="POST" action="/login">
      <input type="hidden" name="next" value="{{NEXT_URL}}">

      <div class="form-group">
        <label for="username">Username or Email</label>
        <div class="input-wrapper">
          <span class="input-icon">👤</span>
          <input 
            type="text" 
            id="username" 
            name="username" 
            placeholder="admin or name@lumiosolutions.com" 
            required 
            autocomplete="username" 
            autofocus
          >
        </div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-wrapper">
          <span class="input-icon">🔑</span>
          <input 
            type="password" 
            id="password" 
            name="password" 
            placeholder="••••••••••••" 
            required 
            autocomplete="current-password"
          >
          <button type="button" class="toggle-pwd" onclick="togglePasswordVisibility()" title="Toggle visibility">👁️</button>
        </div>
      </div>

      <div class="form-extra">
        <label class="remember-label">
          <input type="checkbox" name="remember" value="1" checked>
          <span>Keep me signed in (30 days)</span>
        </label>
      </div>

      <button type="submit" class="btn-submit">
        <span>Authenticate & Enter</span>
        <span>→</span>
      </button>
    </form>

    <div class="footer-note">
      Host: <span class="host-pill">lumiosolutions-office</span><br>
      Authorized personnel only • Session protected by OWASP PBKDF2
    </div>
  </div>

  <script>
    function togglePasswordVisibility() {
      const pwd = document.getElementById('password');
      if (pwd.type === 'password') {
        pwd.type = 'text';
      } else {
        pwd.type = 'password';
      }
    }
  </script>
</body>
</html>
